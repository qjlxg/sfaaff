name: test_nest_real

on:
  push:
    paths:
      - 'test_nest_real.py'
      - '.github/workflows/test_nest_real.yml'
      - 'cf_nest_*.yaml'
      - 'generate_nest.py'
      # 注意：不要把结果文件加到触发路径，避免循环触发

  schedule:
    - cron: '0 18 * * *'   # 北京时间每天 02:00

  workflow_dispatch:
    inputs:
      workers:
        description: '并发数'
        required: false
        default: '5'
      timeout:
        description: '单节点超时（秒）'
        required: false
        default: '8'
      force:
        description: '强制重新测试所有文件（true/false）'
        required: false
        default: 'false'

permissions:
  contents: write          # 必须有写权限才能提交

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 必须加这个，否则后续 push 可能会失败
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Check if there are files to test
        id: check
        run: |
          count=$(ls cf_nest_*.yaml 2>/dev/null | wc -l || true)
          echo "yaml_count=$count" >> $GITHUB_OUTPUT
          if [ "$count" -eq 0 ]; then
            echo "没有找到 cf_nest_*.yaml 文件，跳过测试"
          else
            echo "找到 $count 个待测文件"
            ls -1 cf_nest_*.yaml
          fi

      - name: Set up Python
        if: steps.check.outputs.yaml_count != '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check.outputs.yaml_count != '0'
        run: pip install pyyaml requests

      - name: Install Xray
        if: steps.check.outputs.yaml_count != '0'
        run: |
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -qo Xray-linux-64.zip xray
          chmod +x xray
          sudo mv xray /usr/local/bin/xray
          xray version

      - name: Run real connectivity test
        if: steps.check.outputs.yaml_count != '0'
        env:
          WORKERS: ${{ github.event.inputs.workers || '5' }}
          TIMEOUT: ${{ github.event.inputs.timeout || '8' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          echo "并发数: $WORKERS"
          echo "超时: $TIMEOUT 秒"
          echo "强制重测: $FORCE"

          if [ "$FORCE" = "true" ]; then
            python test_nest_real.py --workers "$WORKERS" --timeout "$TIMEOUT" --force
          else
            python test_nest_real.py --workers "$WORKERS" --timeout "$TIMEOUT"
          fi

      - name: Commit and push alive results
        if: steps.check.outputs.yaml_count != '0'
        run: |
          # 配置 Git 身份
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 只添加结果相关文件
          git add cf_nest_alive.yaml test_nest_progress.json alive_*.yaml 2>/dev/null || true

          # 判断是否有实际变更
          if git diff --staged --quiet; then
            echo "没有新的存活结果需要提交"
          else
            # 提交（带 [skip ci] 防止再次触发工作流）
            git commit -m "chore: update alive proxies and progress [skip ci]"
            git push
            echo "已成功提交存活结果到仓库"
          fi

      - name: Upload artifacts (backup)
        if: steps.check.outputs.yaml_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: nest-test-results
          path: |
            cf_nest_alive.yaml
            test_nest_progress.json
            alive_*.yaml
          if-no-files-found: ignore

      - name: Show summary
        if: steps.check.outputs.yaml_count != '0'
        run: |
          echo "========== 测试结果摘要 =========="
          if [ -f cf_nest_alive.yaml ]; then
            python3 -c "
          import yaml
          with open('cf_nest_alive.yaml', encoding='utf-8') as f:
              data = yaml.safe_load(f) or {}
          print(f'存活节点数量: {len(data.get(\"proxies\", []))}')
          "
          else
            echo "未生成 cf_nest_alive.yaml"
          fi

          if [ -f test_nest_progress.json ]; then
            echo ""
            echo "当前进度："
            cat test_nest_progress.json
          fi
